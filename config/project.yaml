# Paths relative to project root, not current shell directory.
root: ..
output: results/primary
synthetic: false
reference: GRCh38_GENCODEv43
inputs:
  samples: data/prepared/samples.tsv
  counts: data/prepared/counts.tsv
  genes: data/prepared/genes.tsv
  regions: data/prepared/regions.tsv
  sites: data/prepared/motif_sites.parquet
  links: data/prepared/enhancer_links.parquet
  link_provenance: data/prepared/enhancer_links.parquet.provenance.json
  mapping: data/prepared/tf_motif_family.tsv
analysis:
  seed: 17
  # Must be aligned with scE2G candidate domain BEFORE inspecting perturbation results.
  cis_window: 5000000
  distance_power: 1.0
  distance_bins: [2000, 10000, 50000, 100000, 500000, 1000000]
  permutation_seeds: [19, 23, 29, 31, 37]
  alpha_factors: [0.5, 1.0, 2.0]
  bootstrap_repeats: 1000
  min_expression_samples: 6
resources:
  cores: 8
  memory_gb: 32
  disk_gb: 150
maradoner:
  backend: maradoner
  python: .runtime/envs/maradoner/bin/python
  repository: .tools/MARADONER
  timeout_seconds: 86400

